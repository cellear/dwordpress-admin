wp_admin:
  enabled: true
  label: 'WordPress-style admin icons'
  description: 'Sidebar icons for the wp-admin menu.'
  version: 1.x
  license:
    name: GPL2-or-later
    url: https://www.gnu.org/licenses/old-licenses/gpl-2.0.html
    gpl-compatible: true
  extractor: svg
  config:
    sources:
      - icons/*.svg
  settings:
    size:
      title: 'Size'
      type: integer
      default: 20
    class:
      title: 'Class'
      type: string
      default: ''
  template: >
    <svg
      {{ attributes
          .setAttribute('viewBox', attributes.viewBox|default('0 0 24 24'))
          .setAttribute('class', class)
          .setAttribute('width', size|default('20'))
          .setAttribute('height', size|default('20'))
          .setAttribute('aria-hidden', 'true')
      }}
    >
      {{ content }}
    </svg>
