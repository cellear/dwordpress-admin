wp_admin.settings.reading:
  path: '/wp-admin/settings/reading'
  defaults:
    _form: '\Drupal\wp_admin\Form\ReadingSettingsForm'
    _title: 'Reading Settings'
  requirements:
    _permission: 'administer site configuration'
  options:
    _admin_route: TRUE
wp_admin.settings.discussion:
  path: '/wp-admin/settings/discussion'
  defaults:
    _form: '\Drupal\wp_admin\Form\DiscussionSettingsForm'
    _title: 'Discussion Settings'
  requirements:
    _permission: 'administer site configuration'
  options:
    _admin_route: TRUE
wp_admin.settings.media:
  path: '/wp-admin/settings/media'
  defaults:
    _form: '\Drupal\wp_admin\Form\MediaSettingsForm'
    _title: 'Media Settings'
  requirements:
    _permission: 'administer site configuration'
  options:
    _admin_route: TRUE
wp_admin.settings.privacy:
  path: '/wp-admin/settings/privacy'
  defaults:
    _form: '\Drupal\wp_admin\Form\PrivacySettingsForm'
    _title: 'Privacy'
  requirements:
    _permission: 'administer site configuration'
  options:
    _admin_route: TRUE
