title: 'Tools'
intro: 'WordPress’s Available Tools page is nearly empty: it links to the Categories and Tags Converter importer. This page lists the Drupal administration tools that have no WordPress counterpart in the menu.'
sections:
  - heading: 'Drupal tools'
    links:
      - { title: 'Configuration', url: 'route:system.admin_config', description: 'every setting of core and modules, grouped by topic' }
      - { title: 'Reports', url: 'route:system.admin_reports', description: 'status report, available updates, recent log messages, top errors' }
      - { title: 'Recent log messages', url: 'route:dblog.overview', description: 'PHP errors, access denied, page not found, user events' }
      - { title: 'Cron', url: 'route:system.cron_settings', description: 'periodic tasks (WordPress: WP-Cron, which runs on page views)' }
      - { title: 'Performance', url: 'route:system.performance_settings', description: 'page cache lifetime, CSS/JS aggregation; clear all caches' }
      - { title: 'Maintenance mode', url: 'route:system.site_maintenance_mode' }
  - heading: 'Converter'
    text: 'WordPress’s Categories and Tags Converter swaps terms between the two taxonomies. In Drupal a term belongs to one vocabulary; move it by editing the term, or re-create it in the other vocabulary.'
    links:
      - { title: 'Categories', url: '/wp-admin/posts/categories' }
      - { title: 'Tags', url: '/wp-admin/posts/tags' }
